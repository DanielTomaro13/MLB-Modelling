# ===========================================================================
# MLB-Modelling configuration
# ===========================================================================
# Single source of truth for the pipeline. Loaded once by util.load_config and
# threaded through every stage — no env vars, no globals.

sport_id: 1                       # MLB
leagues:                          # statsapi league ids (used by standings)
  al: 103
  nl: 104

# --------------------------------------------------------------------------- #
# Data ingest (public MLB Stats API — no auth)
# --------------------------------------------------------------------------- #
data:
  api_base: "https://statsapi.mlb.com/api/v1"
  api_base_live: "https://statsapi.mlb.com/api/v1.1"
  season: 2026                    # current modelling season
  history_seasons: [2024, 2025, 2026]   # seasons pulled for Elo / backtest
  raw_dir: "data/raw"
  processed_dir: "data/processed"
  park_factors_file: "data/park_factors.csv"

# --------------------------------------------------------------------------- #
# Team / pitcher / batter profiles
# --------------------------------------------------------------------------- #
features:
  # Shrinkage: blend a team/player rate toward the league mean with this many
  # "prior" plate appearances / batters faced.
  # team prior tuned on 2025-26 walk-forward: heavy shrinkage calibrates the
  # totals amplitude (actual~predicted slope ~0.95 at 80 vs 0.56 at 20).
  team_prior_games: 80
  pitcher_prior_bf: 200           # batters faced of league-average prior
  batter_prior_pa: 150
  min_batter_pa: 40
  recency_half_life_days: 240     # exponential decay on game recency (unused v1)

# --------------------------------------------------------------------------- #
# Team Elo (results-based baseline)
# --------------------------------------------------------------------------- #
elo:
  initial: 1500.0
  k: 2.0                          # tuned on backtest — small K suits MLB's high variance
  home_field: 20.0               # ≈ the empirical 52.8% home win rate
  mov_mult: true                 # scale K by margin of victory (run diff)
  season_regression: 0.5         # tuned — regress hard toward mean between seasons

# --------------------------------------------------------------------------- #
# Run-scoring simulation engine
# --------------------------------------------------------------------------- #
sim:
  innings: 9
  league_runs_per_team: 4.45      # league baseline R/G per team (fallback)
  max_team_runs: 22               # run-distribution support cutoff
  overdispersion: 2.0             # neg-binomial var/mean — fit to actual run distribution (var/mean≈2.0 conditional)
  elo_weight: 0.45                # blend weight of Elo win-prob into the sim headline
  home_field_runs: 0.04           # extra expected runs for the home team (empirical edge ≈0.025)
  home_field_wp: 0.10             # logit bump to the home win prob (home edge beyond runs: last AB, travel)
  totals_lines: [6.5, 7.5, 8.5, 9.5, 10.5, 11.5]
  run_line: 1.5
  first_five: true                # price the first-5-innings (F5) markets

# --------------------------------------------------------------------------- #
# Upcoming fixtures
# --------------------------------------------------------------------------- #
fixtures:
  days_ahead: 3                   # schedule window to price
  manual_file: "data/manual_fixtures.csv"

# --------------------------------------------------------------------------- #
# Output paths
# --------------------------------------------------------------------------- #
paths:
  models_dir: "models"
  reports_dir: "reports"
  docs_dir: "docs"
  docs_data_dir: "docs/data"

# --------------------------------------------------------------------------- #
# Backtest
# --------------------------------------------------------------------------- #
backtest:
  holdout_start_season: 2026      # walk-forward: score games from this season on
